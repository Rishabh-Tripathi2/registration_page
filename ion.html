<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
            font-family:'Courier New', Courier, monospace;
        }
        body{
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            
        }
        .main{
            width: 400px;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.432);
            backdrop-filter: blur(130px);
            color: rgba(255, 255, 255, 0.779);
            box-sizing: border-box;
            border-radius: 12px 10px;
            border: 1px solid rgba(255, 255, 255, 0.986);
            box-shadow: 2px 2px 5px rgb(192, 178, 178);
        }
        h1{
            text-align: center;
            color: white;
            margin-bottom: 5px;
        }
        form{
            display: flex;
            flex-direction: column;
        }
        input{
            height: 30px;
            box-sizing: border-box;
            padding: 10px;
            margin: 4px 0;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            outline: none;
        }
        label { color: white;}
        input::placeholder {
            color: rgba(255, 255, 255, 0.8);
        }
        input:focus {
            border: 1px solid white;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }
        input[type="date"] {
            color: white;
            color-scheme: dark;
        }
        .genderG{
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.779);
        }
        button{
            width: 30%;
            margin-top: 5px;
            height: 30px;
            border-radius: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.683);
            box-shadow: 1px 2px 1px rgb(89, 89, 182);
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
        }
        button:hover{
            cursor: pointer;
            transform: scale(1.08);
            background: rgba(255,255,255,0.4);
        }
        .agreeTerm{
            display: flex;
            align-items: center;
            gap: 0% 10px;
            margin: 0%;
        }
        a{
            color: white;
            text-decoration: none;
        }
        #popup{
            position: absolute;
            top: 30%;
            right: 12%;
            width: 300px;
            height: 100px;
            background: rgba(20, 15, 35, 0.85);
            border: 1px solid rgba(255, 80, 100, 0.6);
            box-shadow: 0 0 25px rgba(255, 50, 80, 0.2);
            color: #ff6b81;
            backdrop-filter: blur(20px);
            border-radius: 18px;
            padding: 30px;
            box-sizing: border-box;
            font-weight: 900;
        }
        .close{
            position: absolute;
            width: 30px;
            top: 0px;
            right:10px;
        }
        .hidden{
            display: none;
        }

a:hover {
    color: #dcd6ff;
    text-decoration: underline;
}
    </style>
</head>
<body>
   <div class="main">
    <h1>REGISTRATION FORM</h1>
    <form action="">
        <label for="Name">Username</label>
        <input type="text" name="uname" placeholder="Enter your username" oninput="this.value=this.value.replace(/[^a-zA-Z ]/g,'')" required> 
        <label for="Email">Email</label>
        <input type="email" name="email" placeholder="Enter your email">
        <label for="uphno">Phone Number</label>
        <input type="tel" name="" id="phno" placeholder="Enter your mobile Number ">
        <label for="password">Password</label>
        <input type="password" name="upass" placeholder="Enter password"> 
        <label for="cPassword">Confirm Password</label>
        <input type="password" name="cpass" placeholder="Confirm password"> 
        <div class="genderG"> 
        <label for="Gender">Gender:</label>
        <input type="radio" name="gender" id="male" value="male"> Male
        <input type="radio" name="gender" id="femal"> Female
        <input type="radio" name="gender" id="order"> Other
        </div>
        <label for="dob">Date of birth</label>
        <input type="date" name="" id=""> 
        <div class="agreeTerm">
            <input type="checkbox" name="" id=""> I agree <a href="http://">term and condition</a>
        </div>
        <div class="buttonG">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>
    </form>

    
   <div id="popup" class="hidden">
        <p></p>
        <button class="close"  >X</button>
   </div>
   </div>
   <script>
        let errorElement=document.querySelector("#popup");
        document.querySelector("form").addEventListener("submit",(e)=>{
            e.preventDefault();
            let name=document.querySelector('input[type="text"]').value.trim();
            let email=document.querySelector('input[type="email"]').value.trim();
            let phno=document.querySelector('input[type="tel"]').value;
            let pass=document.querySelector('input[name="upass"]').value;
            let cpass=document.querySelector('input[name="cpass"]').value;
            let date=document.querySelector('input[type="date"]').value;
            console.log(typeof phno);
            
            let gender=document.querySelector('input[name="gender"]:checked');
            let agree=document.querySelector('input[type="checkbox"]:checked');
            if(!email.includes('.')){
                 
                errorElement.classList.remove("hidden");
                errorElement.children[0].innerText='Please ! Enter valid email id';
                e.preventDefault();
            }
            else if (!/^[6-9]\d{9}$/.test(phno)) 
            {
                errorElement.classList.remove("hidden");
                errorElement.children[0].innerText='Please ! Number must be 10 digit number';
                e.preventDefault();
            }
           
            else if(pass=='' || cpass=='' ){
                 errorElement.classList.remove("hidden");
                errorElement.children[0].innerText='Please ! Enter password and confirm password';
                e.preventDefault();
            }
            else if(pass!=cpass){
                 errorElement.classList.remove("hidden");
                errorElement.children[0].innerText='Please ! password mismatch';
                e.preventDefault();
            }
             else if(!gender){
                errorElement.classList.remove("hidden");
                errorElement.children[0].innerText='Please ! select gender';
                e.preventDefault();
            }
             else if(!agree){
                 errorElement.classList.remove("hidden");
                errorElement.children[0].innerText='Please ! checkout term and condition';
                e.preventDefault();
            }
                errorElement.classList.remove("hidden");
                errorElement.children[0].innerText='Registration Succesfully ';
                document.querySelector("form").reset();
            
        });
        errorElement.children[1].addEventListener("click",()=>{
            errorElement.classList.add("hidden");
        })
        
   </script>
</body>
</html>
